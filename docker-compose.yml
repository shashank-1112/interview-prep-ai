# Backend only, per MVP scope - the Angular frontend runs via `ng serve`
# in dev mode for now (see README.md). It can get its own service here
# later if/when it needs containerizing too.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Bind-mounts the source code into the container, paired with
      # `--reload` below - lets you edit code on the host and see changes
      # take effect immediately, without rebuilding the image. For a real
      # production deployment, drop this volume and the --reload flag,
      # and let the code baked into the image (via the Dockerfile's COPY)
      # be the only copy that runs.
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
